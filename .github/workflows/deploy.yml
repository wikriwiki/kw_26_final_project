name: build-and-deploy

# main 갱신 시: 이미지 빌드 → GHCR push → (시크릿 있으면) GPU 서버 자동 배포.
on:
  push:
    branches: [main]
  workflow_dispatch:   # 수동 실행 버튼

env:
  IMAGE: ghcr.io/${{ github.repository }}   # ghcr.io/wikriwiki/kw_26_final_project

jobs:
  # ── ① 빌드 & GHCR push (GITHUB_TOKEN 으로 인증, 별도 시크릿 불필요) ──
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true                       # 이미지에 들어갈 data/·stats LFS 파일

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── ② GPU 서버 배포 (게이트 경유 SSH). 시크릿 없으면 자동 skip(green) ──
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check deploy secrets
        id: chk
        env:
          KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::warning::SSH 시크릿 미설정 — 배포 단계 건너뜀 (DEPLOY.md 참고)"
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy over SSH (gate → GPU)
        if: steps.chk.outputs.go == 'true'
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          GATE_HOST: ${{ secrets.GATE_HOST }}     # 예: ubuntu@gate-public-ip
          GPU_HOST:  ${{ secrets.GPU_HOST }}      # 예: ubuntu@gpu-private-ip
          APP_DIR:   ${{ secrets.APP_DIR }}       # 예: /home/ubuntu/kw_26_final_project
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id
          chmod 600 ~/.ssh/id
          # 같은 배포키로 게이트(ProxyCommand)와 GPU 서버 양쪽 인증
          ssh -i ~/.ssh/id -o StrictHostKeyChecking=no \
            -o ProxyCommand="ssh -i ~/.ssh/id -o StrictHostKeyChecking=no -W %h:%p $GATE_HOST" \
            "$GPU_HOST" "
            set -e
            cd '$APP_DIR'
            git pull --ff-only
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d
            docker image prune -f
          "
