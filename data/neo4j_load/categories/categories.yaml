# 소비자 관점 12대분류 (10 + 교육 + 기타)
# 매핑 테이블: ../mapping/mapping_upjong_to_sub.json
# sub 어휘는 소상공인 데이터에서 자동 추출
# open/close: L1 단위 기본 운영시간 (HH 정수). POI별 실측치 도착 시 덮어쓰기.
#
# 욕구(desire) 파라미터 — L1 기본값, L2 sub 가 dict 면 override (예: { name: 분식, saturation_n: 18 })
#   recovery_tau_days : 방문 후 욕구 회복 시간 상수 (일). 작을수록 빠른 회복.
#   desire_drop       : 방문 직후 욕구 하락 폭 [0,1]. 1.0=완전 소진.
#   saturation_n      : 30일 안에 N회 방문하면 욕구 절반 (시그모이드 중심).
categories:
  - name: 식사
    open: 11
    close: 22
    recovery_tau_days: 3.0
    desire_drop: 0.85
    saturation_n: 12
    sub:
      - 구내식당·뷔페
      - 기타식사
      - 기타외국
      - 분식
      - 아시안
      - 양식
      - 일식
      - 중식
      - 치킨
      - 피자
      - 한식
  - name: 카페
    open: 7
    close: 22
    recovery_tau_days: 5.0
    desire_drop: 0.80
    saturation_n: 8
    sub:
      - 카페
  - name: 디저트
    open: 10
    close: 22
    recovery_tau_days: 4.0
    desire_drop: 0.85
    saturation_n: 6
    sub:
      - 베이커리
      - 아이스크림
  - name: 주점
    open: 18
