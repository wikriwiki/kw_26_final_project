<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>SIM SEOUL — 시연 인트로</title>
<style>
  /* ─────────────────────────────────────────────────────────────
     시연 인트로 · 19.5초 · 1280×720

     Tella 로 이 화면을 그대로 녹화한다. 새로고침하면 처음부터 재생된다.

     내레이션(`docs/tts/01_intro.txt`)과 박자를 맞췄다.
       0.6s  "정책을 시행하기 전에, 그 정책이 정말 소비를 늘릴지 미리 알 수 있을까요."
       7.0s  "서울 시민 칠천오백 명을 각각 하나의 인공지능으로 만들었습니다."
      12.6s  "그리고 십사 일 동안, 실제로 소비하게 했습니다."

     바탕색은 콘솔과 같은 #f8fafc 다. 마지막 컷에서 실제 화면으로 넘어갈 때
     배경이 이어져 끊기지 않는다.
     ───────────────────────────────────────────────────────────── */

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: #f8fafc; overflow: hidden; }
  body {
    display: grid; place-items: center;
    font-family: Inter, "Pretendard", "Noto Sans KR", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .stage { width: 1280px; height: 720px; }

  /* --- 손맛 -------------------------------------------------------------
     선을 흔든다. 필터 셋을 초당 여덟 번 갈아 끼우면 종이에 매 프레임 다시
     그린 것처럼 선이 미세하게 살아 움직인다. 글자에는 걸지 않는다 — 읽혀야 한다. */
  .ink {
    fill: none; stroke: #0f172a;
    stroke-linecap: round; stroke-linejoin: round;
    stroke-dasharray: var(--len); stroke-dashoffset: var(--len);
    animation:
      draw var(--dur, 1.2s) cubic-bezier(.35,.1,.25,1) forwards var(--at, 0s),
      boil .375s steps(1) infinite;
    animation-play-state: paused;
  }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  @keyframes boil {
    0%   { filter: url(#r1); }
    34%  { filter: url(#r2); }
    67%  { filter: url(#r3); }
  }

  /* 스케치는 한 번에 한 줄로 안 그려진다. 겹쳐 그은 자국을 흐리게 얹는다 */
  .lead  { stroke-width: 2.6; }
  .twice { stroke-width: 1.5; opacity: .32; }
  .thin  { stroke-width: 1.9; }
  .river { stroke-width: 3.4; stroke: #1e3a5f; opacity: .5; }

  .pop  { opacity: 0; animation: pop .4s cubic-bezier(.2,1.5,.4,1) forwards var(--at); }
  @keyframes pop { from { opacity: 0; transform: scale(.3); } to { opacity: 1; transform: scale(1); } }

  .fade { opacity: 0; animation: fade .8s ease-out forwards var(--at); }
  @keyframes fade { to { opacity: 1; } }

  .rise { opacity: 0; animation: rise .9s cubic-bezier(.2,0,0,1) forwards var(--at); }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

  .gone { animation: gone .7s ease-in forwards var(--at); }
  @keyframes gone { to { opacity: 0; } }

  .pop, .fade, .rise, .gone { animation-play-state: paused; }
  body.go .ink, body.go .pop, body.go .fade, body.go .rise, body.go .gone {
    animation-play-state: running;
  }

  /* --- 글자 -------------------------------------------------------------
     그림은 거칠게, 글자는 또렷하게. 둘 다 손글씨면 산만하고,
     무엇보다 심사용 영상에서 숫자가 안 읽히면 안 된다. */
  text { fill: #0f172a; }
  .ask   { font-size: 52px; font-weight: 600; letter-spacing: -.02em; }
  .sub   { font-size: 23px; font-weight: 400; fill: #475569; }
  .count { font-size: 88px; font-weight: 600; letter-spacing: -.03em; }
  .tag   { font-size: 21px; font-weight: 500; fill: #475569; }
  .mark  { font-size: 18px; font-weight: 500; fill: #475569; }
  .navy  { fill: #1e3a5f; }

  .brand { font-size: 68px; font-weight: 600; letter-spacing: .14em; }
  .team  { font-size: 22px; font-weight: 500; fill: #475569; letter-spacing: .06em; }
</style>
</head>
<body>
<div class="stage">
<svg viewBox="0 0 1280 720" width="1280" height="720">
<defs>
  <!-- 같은 흔들림을 seed 만 바꿔 셋. 번갈아 걸어 선이 살아 있게 만든다 -->
  <filter id="r1" x="-12%" y="-12%" width="124%" height="124%">
    <feTurbulence type="fractalNoise" baseFrequency="0.026" numOctaves="2" seed="3" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="2.6" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <filter id="r2" x="-12%" y="-12%" width="124%" height="124%">
    <feTurbulence type="fractalNoise" baseFrequency="0.026" numOctaves="2" seed="17" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="2.6" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <filter id="r3" x="-12%" y="-12%" width="124%" height="124%">
    <feTurbulence type="fractalNoise" baseFrequency="0.026" numOctaves="2" seed="41" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="2.6" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</defs>

<!-- ══ 1. 질문 · 0.6s~6.6s ══════════════════════════════════════════
     내레이션이 묻는 동안 화면도 같이 묻는다. 그림보다 질문이 먼저다. -->
<g class="gone" style="--at:6.2s">
  <text class="ask fade" style="--at:.6s" x="640" y="330" text-anchor="middle">
    이 정책, 정말 소비를 늘릴까?
  </text>
  <path class="ink lead"  style="--dur:.9s; --at:1.9s"  d="M405 362 q118 -11 236 -6 q120 5 234 3"/>
  <path class="ink twice" style="--dur:.9s; --at:2.05s" d="M409 367 q120 -8 234 -4 q118 4 230 1"/>
  <text class="sub fade" style="--at:3.1s" x="640" y="416" text-anchor="middle">
    시행하고 나면, 되돌릴 수 없다
  </text>
</g>

<!-- ══ 2. 서울과 사람 · 6.6s~12.4s ═══════════════════════════════════
     구름이 아니라 서울이다. 북동쪽으로 뻗은 노원·도봉, 동쪽 끝 강동,
     남쪽으로 내려오는 관악·금천, 서쪽으로 튀어나온 강서 — 실제 윤곽의
     특징을 살렸다. 한강을 함께 그으면 무엇인지 바로 읽힌다. -->
<g class="gone" style="--at:15.9s">
  <path id="seoul" class="ink lead" style="--dur:2.6s; --at:6.6s"
        d="M340 312 Q350 296 363 281 Q377 272 392 270 Q407 271 421 274 Q428 262 433 249 Q440 229 450 211 Q470 199 491 193 Q517 188 543 186 Q558 178 572 172 Q590 167 607 165 Q628 169 647 176 Q657 191 665 207 Q671 224 676 242 Q689 256 700 270 Q703 284 705 298 Q749 293 792 291 Q821 297 850 305 Q863 317 874 330 Q869 346 862 361 Q845 375 827 389 Q804 396 781 403 Q764 413 746 424 Q726 442 705 459 Q686 467 665 473 Q641 486 618 498 Q598 493 578 487 Q564 501 549 515 Q534 505 520 494 Q500 484 479 473 Q461 459 444 445 Q427 435 410 424 Q392 410 375 396 Q363 377 352 358 Q345 335 340 312 Z"/>
  <path class="ink twice" style="--dur:2.6s; --at:6.95s"
        d="M344 309 Q350 296 363 281 Q377 272 392 270 Q407 271 421 274 Q428 262 433 249 Q440 229 450 211 Q470 199 491 193 Q517 188 543 186 Q558 178 572 172 Q590 167 607 165 Q628 169 647 176 Q657 191 665 207 Q671 224 676 242 Q689 256 700 270 Q703 284 705 298 Q749 293 792 291 Q821 297 850 305 Q863 317 874 330 Q869 346 862 361 Q845 375 827 389 Q804 396 781 403 Q764 413 746 424 Q726 442 705 459 Q686 467 665 473 Q641 486 618 498 Q598 493 578 487 Q564 501 549 515 Q534 505 520 494 Q500 484 479 473 Q461 459 444 445 Q427 435 410 424 Q392 410 375 396 Q363 377 352 358 Q345 335 340 312 Z"/>

  <!-- 한강 — 서울을 가장 빨리 알아보게 하는 선 -->
  <path id="han" class="ink river" style="--dur:1.6s; --at:8.4s"
        d="M357 326 Q400 335 444 340 Q488 334 531 326 Q575 332 618 340 Q659 348 700 354 Q746 344 792 333 Q827 326 862 319"/>

  <!-- 사람 — 좌표는 아래 스크립트가 뽑는다. 서울 안쪽, 강을 피해서 -->
  <g id="people"></g>

  <text class="count fade" style="--at:10.6s" x="1075" y="300" text-anchor="middle">7,500</text>
  <text class="tag fade"   style="--at:11.0s" x="1075" y="336" text-anchor="middle">명의 서울 시민</text>
  <path class="ink thin"   style="--dur:.7s; --at:11.4s" d="M1000 358 q75 -6 150 -2"/>
  <text class="tag fade"   style="--at:11.8s" x="1075" y="392" text-anchor="middle">각자 판단하는</text>
  <text class="tag fade"   style="--at:11.95s" x="1075" y="420" text-anchor="middle">인공지능</text>
</g>

<!-- ══ 3. 십사 일과 갈림길 · 12.4s~16.4s ═════════════════════════════
     이 프로젝트의 핵심 그림이다. 같은 사람들에게 같은 기간을 두 번 살게 하고
     한쪽에만 쿠폰을 넣었다. 보고서의 이중차분이 바로 이 그림을 계산한 것이다. -->
<g class="gone" style="--at:15.9s">
  <path class="ink lead"  style="--dur:1.1s; --at:12.4s"  d="M250 600 q380 -8 760 -3"/>
  <path class="ink twice" style="--dur:1.1s; --at:12.55s" d="M252 605 q378 -6 756 -2"/>

  <path class="ink thin" style="--dur:.5s; --at:13.2s" d="M630 578 v44"/>
  <text class="mark fade navy" style="--at:13.4s" x="630" y="566" text-anchor="middle">쿠폰 지급</text>

  <path class="ink lead" style="--dur:1.0s; --at:13.6s"
        d="M630 600 q120 -26 190 -44 q90 -22 190 -34"/>
  <text class="tag fade navy" style="--at:14.5s" x="1018" y="516">정책 적용 후</text>

  <path class="ink thin fade" style="--dur:1.0s; --at:13.9s"
        stroke-dasharray="7 7" d="M630 600 q120 5 190 9 q92 4 190 4"/>
  <text class="tag fade" style="--at:14.8s" x="1018" y="620">정책 적용 전 추세</text>

  <text class="sub fade" style="--at:15.0s" x="250" y="686">
    같은 사람, 같은 십사 일 — 한쪽에만 정책을 넣었다
  </text>
</g>

<!-- ══ 4. 창이 그려지고 이름이 뜬다 · 16.2s~19.5s ══════════════════
     배경색이 콘솔과 같아서, 이 창이 그대로 실제 화면으로 이어진다. -->
<rect class="ink lead" style="--dur:1.8s; --at:16.2s" x="196" y="128" width="888" height="472" rx="8"/>
<path class="ink thin" style="--dur:.7s; --at:17.5s" d="M196 182 h888"/>
<circle class="pop navy" style="--at:17.9s" cx="228" cy="155" r="5.5"/>
<circle class="pop navy" style="--at:18.0s" cx="250" cy="155" r="5.5"/>
<circle class="pop navy" style="--at:18.1s" cx="272" cy="155" r="5.5"/>

<text class="brand rise" style="--at:18.1s" x="640" y="380" text-anchor="middle">SIM SEOUL</text>
<path class="ink thin" style="--dur:.8s; --at:18.7s" d="M523 410 q118 -7 236 -3"/>
<text class="team rise" style="--at:19.0s" x="640" y="450" text-anchor="middle">Out of Memory</text>
</svg>
</div>
<script>
  /* 선 길이를 눈으로 어림해 적으면 반드시 어긋난다. 짧게 적으면 시작부터 일부가
     그려진 채 보이고, 길게 적으면 그리기가 늦게 시작된다. 실제 길이를 재서
     넣고, 다 넣은 다음 한꺼번에 출발시킨다 — 같이 출발해야 --at 순서가 맞는다.

     점선(stroke-dasharray 를 직접 준 선)은 건드리지 않는다. 그 선의 점선은
     그리기 효과가 아니라 "없었을 세계"를 뜻하는 표시다. */
  for (const el of document.querySelectorAll('.ink')) {
    if (el.hasAttribute('stroke-dasharray')) { el.style.setProperty('--len', 0); continue; }
    el.style.setProperty('--len', Math.ceil(el.getTotalLength()));
  }

  /* --- 사람 점 뿌리기 -------------------------------------------------------
     손으로 좌표를 찍으면 줄이 보이고, 경계에 걸치거나 강 위에 올라앉는다.
     규칙만 주고 뽑는다.

       · 서울 안쪽이어야 한다 — 그것도 **테두리에서 떨어져서**. 점 하나가
         경계선에 겹치면 윤곽이 뭉개져 보인다
       · 한강 위는 비운다. 강 위에 사람이 서 있을 수는 없다
       · 서로 너무 붙지 않는다 — 뭉치면 얼룩처럼 보인다

     난수는 씨앗을 고정한다. 다시 녹화해도 같은 그림이 나와야 한다. */
  (function scatter() {
    const svg = document.querySelector('svg');
    const shape = document.getElementById('seoul');
    const river = document.getElementById('han');

    const probe = shape.cloneNode();
    probe.removeAttribute('class'); probe.removeAttribute('style');
    probe.setAttribute('fill', '#000'); probe.setAttribute('opacity', '0');
    svg.appendChild(probe);

    const RIVER_KEEP = 26;   // 강에서 이만큼 떨어진다
    const EDGE_KEEP  = 16;   // 경계에서 이만큼 안쪽으로
    // 점이 많으면 도시가 아니라 벌레 떼처럼 보인다. 수를 줄이고 사이를 넓힌다 —
    // 어차피 칠천오백을 세는 그림이 아니라 "사람들이 흩어져 있다"를 말하는 그림이다.
    const APART      = 52;   // 점끼리 최소 간격
    const WANTED     = 20;

    const riverPts = [];
    const rl = river.getTotalLength();
    for (let i = 0; i <= 140; i++) riverPts.push(river.getPointAtLength(rl * i / 140));

    const pt = svg.createSVGPoint();
    const inside = (x, y) => { pt.x = x; pt.y = y; return probe.isPointInFill(pt); };
    // 테두리에서 떨어졌는지 — 사방 EDGE_KEEP 지점이 모두 안쪽이면 안전하다
    const wellInside = (x, y) =>
      inside(x, y) &&
      inside(x + EDGE_KEEP, y) && inside(x - EDGE_KEEP, y) &&
      inside(x, y + EDGE_KEEP) && inside(x, y - EDGE_KEEP) &&
      inside(x + 11, y + 11) && inside(x - 11, y - 11) &&
      inside(x + 11, y - 11) && inside(x - 11, y + 11);

    let seed = 20250721;
    const rnd = () => (seed = (seed * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff;

    const box = probe.getBBox();
    const kept = [];
    for (let tries = 0; tries < 40000 && kept.length < WANTED; tries++) {
      const x = box.x + rnd() * box.width;
      const y = box.y + rnd() * box.height;
      if (!wellInside(x, y)) continue;
      let ok = true;
      for (const r of riverPts) {
        if ((r.x - x) ** 2 + (r.y - y) ** 2 < RIVER_KEEP ** 2) { ok = false; break; }
      }
      if (!ok) continue;
      for (const k of kept) {
        if ((k.x - x) ** 2 + (k.y - y) ** 2 < APART ** 2) { ok = false; break; }
      }
      if (ok) kept.push({ x, y });
    }
    probe.remove();

    /* 왼쪽에서 오른쪽으로 차르륵. 줄 단위로 찍으면 격자가 드러나는데,
       가로로 쓸고 지나가면 서쪽에서 동쪽으로 도시가 채워지는 것처럼 읽힌다. */
    kept.sort((a, b) => a.x - b.x);
    const START = 8.9, SPAN = 2.5;
    const host = document.getElementById('people');
    kept.forEach((p, i) => {
      const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      c.setAttribute('class', 'pop navy');
      c.setAttribute('cx', p.x.toFixed(1));
      c.setAttribute('cy', p.y.toFixed(1));
      c.setAttribute('r', '5.2');
      c.style.setProperty('--at', (START + SPAN * i / (kept.length - 1)).toFixed(3) + 's');
      host.appendChild(c);
    });
  })();

  requestAnimationFrame(() => document.body.classList.add('go'));
</script>
</body>
</html>
